version: '3'

vars:
  ENV_FILE: config/sandbox.env

# Load sandbox.env so tasks can reference vars; scripts also source it.
dotenv: ['config/sandbox.env']

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ── tooling ──────────────────────────────────────────────────────────────
  deps:
    desc: Check host dependencies (qemu, cloud-localds, nft, mise, task)
    cmds:
      - |
        echo "==> Checking host dependencies"
        missing=0
        for bin in qemu-system-x86_64 qemu-img cloud-localds genisoimage task mise; do
          if command -v "$bin" >/dev/null 2>&1; then
            printf "  %-22s %s\n" "$bin" "$(command -v "$bin")"
          else
            # cloud-localds may be provided by cloud-image-utils; genisoimage fallback is acceptable
            if [ "$bin" = "genisoimage" ] && command -v genisoimage >/dev/null 2>&1; then continue; fi
            if [ "$bin" = "cloud-localds" ] && command -v cloud-localds >/dev/null 2>&1; then continue; fi
            printf "  %-22s MISSING\n" "$bin"
            missing=1
          fi
        done
        echo ""
        echo "Optional (for bridged mode): brctl / ip, iptables, dnsmasq"
        for bin in ip iptables; do
          if command -v "$bin" >/dev/null 2>&1; then printf "  %-22s %s\n" "$bin" "$(command -v "$bin")"; else printf "  %-22s MISSING\n" "$bin"; fi
        done
        echo ""
        if [ "$missing" = "1" ]; then
          echo "Install missing deps:"
          echo "  Ubuntu/Debian: sudo apt-get install qemu-system-x86 qemu-utils cloud-image-utils genisoimage task"
          echo "  mise:          curl https://mise.run | sh   (or via cargo/brew)"
          echo "  On Windows:    use WSL2 (KVM only works under Linux/WSL2)"
        fi
        echo ""
        if command -v mise >/dev/null 2>&1; then
          echo "==> mise"
          mise --version
        fi
        if command -v qemu-system-x86_64 >/dev/null 2>&1; then
          echo ""
          echo "==> QEMU"
          qemu-system-x86_64 --version | head -1
          if [ -c /dev/kvm ]; then echo "KVM: available (/dev/kvm)"; else echo "KVM: NOT available (VM will be slow TCG)"; fi
        fi

  mise:install:
    desc: Install repo tools via mise (task, etc.)
    cmds:
      - mise install

  gen:key:
    desc: Generate admin SSH keypair if missing
    cmds:
      - bash vm/scripts/gen-key.sh

  # ── image ────────────────────────────────────────────────────────────────
  image:download:
    desc: Download Ubuntu cloud image (qcow2)
    cmds:
      - bash vm/scripts/download-image.sh

  image:info:
    desc: Show downloaded image info
    cmds:
      - |
        . config/sandbox.env
        base="${IMAGES_DIR:-vm/images}/noble-server-cloudimg-${UBUNTU_ARCH:-amd64}.img"
        if [ ! -f "$base" ]; then base=$(ls ${IMAGES_DIR:-vm/images}/*.img 2>/dev/null | head -1); fi
        if [ -f "${base:-}" ]; then qemu-img info "$base"; ls -lh "$base"; else echo "No image found. Run: task image:download"; fi

  # ── networking ───────────────────────────────────────────────────────────
  network:up:
    desc: Create bridge + TAP (requires sudo, honours NETWORK_MODE/PHYS_IF)
    cmds:
      - sudo -E bash vm/scripts/network-up.sh

  network:down:
    desc: Remove bridge + TAP (requires sudo)
    cmds:
      - sudo -E bash vm/scripts/network-down.sh

  network:status:
    desc: Show bridge/TAP/iptables status
    cmds:
      - bash vm/scripts/network-status.sh

  # ── VM lifecycle ─────────────────────────────────────────────────────────
  vm:prepare:
    desc: Build seed ISO and data disk from cloud-init templates
    deps: [gen:key]
    cmds:
      - bash vm/scripts/prepare-vm.sh

  vm:start:
    desc: Start the VM (creates bridge if needed, then launches QEMU)
    cmds:
      - bash vm/scripts/start-vm.sh

  vm:stop:
    desc: Stop the VM gracefully (QEMU monitor quit)
    cmds:
      - bash vm/scripts/stop-vm.sh

  vm:kill:
    desc: Force-kill QEMU if vm:stop hangs
    cmds:
      - bash vm/scripts/kill-vm.sh

  vm:console:
    desc: Attach to VM serial console (exit with Ctrl-a x)
    cmds:
      - bash vm/scripts/console.sh

  vm:ssh:
    desc: SSH as admin (forwards to VM via bridge or hostfwd)
    cmds:
      - bash vm/scripts/ssh-admin.sh

  vm:ssh:wait:
    desc: Wait until VM SSH is reachable (polls)
    cmds:
      - bash vm/scripts/wait-ssh.sh

  vm:info:
    desc: Show VM status, PID, network mode, disks
    cmds:
      - bash vm/scripts/vm-info.sh

  vm:clean:
    desc: Remove generated disks and seed ISO (keeps base cloud image)
    cmds:
      - bash vm/scripts/clean-vm.sh

  vm:clean:all:
    desc: Remove everything including base cloud image
    cmds:
      - bash vm/scripts/clean-vm.sh --all

  # ── sandbox user management (run on host, proxies to VM via SSH) ────────
  user:add:
    desc: "Create a sandbox user: task user:add USER=alice [KEY=~/.ssh/id_ed25519.pub]"
    cmds:
      - |
        if [ -z "{{.USER}}" ]; then echo "Usage: task user:add USER=<name> [KEY=path/to/key.pub]"; exit 1; fi
        bash vm/scripts/manage-user.sh add "{{.USER}}" "{{.KEY}}"

  user:remove:
    desc: "Remove a sandbox user: task user:remove USER=alice"
    cmds:
      - |
        if [ -z "{{.USER}}" ]; then echo "Usage: task user:remove USER=<name>"; exit 1; fi
        bash vm/scripts/manage-user.sh remove "{{.USER}}"

  user:list:
    desc: List sandbox users (proxies to VM)
    cmds:
      - bash vm/scripts/manage-user.sh list

  # ── firewall (proxies to VM nftables) ────────────────────────────────────
  fw:allow:
    desc: "Allow an IP to SSH to the VM: task fw:allow IP=1.2.3.4"
    cmds:
      - |
        if [ -z "{{.IP}}" ]; then echo "Usage: task fw:allow IP=<addr>[/prefix]"; exit 1; fi
        bash vm/scripts/manage-firewall.sh allow "{{.IP}}"

  fw:deny:
    desc: "Block an IP at the VM firewall: task fw:deny IP=1.2.3.4"
    cmds:
      - |
        if [ -z "{{.IP}}" ]; then echo "Usage: task fw:deny IP=<addr>[/prefix]"; exit 1; fi
        bash vm/scripts/manage-firewall.sh deny "{{.IP}}"

  fw:remove:
    desc: "Remove an IP from allow/deny sets: task fw:remove IP=1.2.3.4"
    cmds:
      - |
        if [ -z "{{.IP}}" ]; then echo "Usage: task fw:remove IP=<addr>[/prefix]"; exit 1; fi
        bash vm/scripts/manage-firewall.sh remove "{{.IP}}"

  fw:list:
    desc: List nftables allow/deny sets
    cmds:
      - bash vm/scripts/manage-firewall.sh list

  # ── container ────────────────────────────────────────────────────────────
  container:build:
    desc: Build the sandbox container image inside the running VM
    cmds:
      - bash vm/scripts/container-build.sh

  container:info:
    desc: Show container image info from inside the VM
    cmds:
      - bash vm/scripts/container-info.sh

  # ── verification ─────────────────────────────────────────────────────────
  smoke:
    desc: Quick smoke test (requires running VM and at least one sandbox user)
    cmds:
      - bash vm/scripts/smoke-test.sh

  # ── convenience ──────────────────────────────────────────────────────────
  up:
    desc: Full bring-up — deps check, download image, network, prepare, start, wait for SSH
    cmds:
      - task: deps
      - task: image:download
      - task: vm:prepare
      - task: vm:start
      - task: vm:ssh:wait

  down:
    desc: Stop VM and tear down bridge/TAP
    cmds:
      - task: vm:stop
      - task: network:down
