# mise — Gleiphnir host tooling + task runner
# Requires: mise (https://mise.run) and pwsh 7+ (PowerShell) on PATH.
# All orchestration lives here; the old Taskfile.yml was removed.
# Run `mise tasks ls` to list, `mise run <task>` to execute.

[tools]
opencode = "latest"
powershell = "latest"
syft = "latest"            # SBOM generation (SPDX + CycloneDX)
"github:equinix-labs/otel-cli" = "latest"   # OTel tracing for host pwsh scripts
carapace = "latest"
# mise itself is the only hard host requirement (plus pwsh + qemu, checked by `mise run deps`)

[settings]
experimental = true
not_found_auto_install = true

[env]
# Shared tunables — consumed by vm/scripts/*.ps1 via lib.ps1
_.file = "{{ config_root }}/config/sandbox.env"

# ── default ────────────────────────────────────────────────────────────────
[tasks.default]
description = "Show available tasks"
run = "mise tasks ls"

# ── tooling ────────────────────────────────────────────────────────────────
[tasks.deps]
description = "Check host dependencies (qemu, python/pycdlib, mise, pwsh)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/deps.ps1'"

[tasks.'install:deps']
description = "Install missing host dependencies (qemu, python, pycdlib, apt packages)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/install-deps.ps1'"

[tasks.'gen:key']
description = "Generate admin SSH keypair if missing"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/gen-key.ps1'"

# ── image ──────────────────────────────────────────────────────────────────
[tasks.'image:download']
description = "Download Ubuntu cloud image (qcow2)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/download-image.ps1'"

[tasks.'image:info']
description = "Show downloaded image info"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/image-info.ps1'"

# ── networking ─────────────────────────────────────────────────────────────
[tasks.'network:up']
description = "Create bridge + TAP (Linux, requires sudo)"
run = "sudo -E {{ which('pwsh') }} -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/network-up.ps1'"

[tasks.'network:down']
description = "Remove bridge + TAP (Linux, requires sudo)"
run = "sudo -E {{ which('pwsh') }} -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/network-down.ps1'"

[tasks.'network:status']
description = "Show bridge/TAP/iptables status"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/network-status.ps1'"

# ── VM lifecycle ───────────────────────────────────────────────────────────
[tasks.'vm:prepare']
description = "Build seed ISO and data disk from cloud-init templates"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/prepare-vm.ps1'"

[tasks.'vm:start']
description = "Start the VM (creates bridge if needed on Linux, then launches QEMU)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/start-vm.ps1'"

[tasks.'vm:stop']
description = "Stop the VM gracefully (QEMU monitor quit)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/stop-vm.ps1'"

[tasks.'vm:kill']
description = "Force-kill QEMU if vm:stop hangs"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/kill-vm.ps1'"

[tasks.'vm:console']
description = "Attach to VM serial console log (exit with Ctrl-C)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/console.ps1'"

[tasks.'vm:ssh']
description = "SSH as admin (forwards to VM via bridge or hostfwd)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/ssh-admin.ps1'"

[tasks.'vm:ssh:wait']
description = "Wait until VM SSH is reachable (polls)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/wait-ssh.ps1'"

[tasks.'vm:info']
description = "Show VM status, PID, network mode, disks"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/vm-info.ps1'"

[tasks.'vm:clean']
description = "Remove generated disks and seed ISO (keeps base cloud image)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/clean-vm.ps1'"

[tasks.'vm:clean:all']
description = "Remove everything including base cloud image"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/clean-vm.ps1' -All"

# ── sandbox user management (proxies to VM via SSH) ───────────────────────
[tasks.'user:add']
description = "Create a sandbox user: mise run user:add USER=alice [KEY=~/.ssh/id_ed25519.pub]"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-user.ps1' add"

[tasks.'user:remove']
description = "Remove a sandbox user: mise run user:remove USER=alice"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-user.ps1' remove"

[tasks.'user:list']
description = "List sandbox users (proxies to VM)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-user.ps1' list"

# ── firewall (proxies to guest ufw) ───────────────────────────────────────
[tasks.'fw:allow']
description = "Allow an IP to SSH to the VM: mise run fw:allow IP=1.2.3.4"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-firewall.ps1' allow"

[tasks.'fw:deny']
description = "Block an IP at the VM firewall: mise run fw:deny IP=1.2.3.4"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-firewall.ps1' deny"

[tasks.'fw:remove']
description = "Remove an IP from allow/deny rules: mise run fw:remove IP=1.2.3.4"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-firewall.ps1' remove"

[tasks.'fw:list']
description = "List ufw rules in the VM"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-firewall.ps1' list"

[tasks.'fw:enforce']
description = "Lock down SSH to allow-listed IPs only (removes bootstrap open rule)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-firewall.ps1' enforce"

# ── policy (sbx policy parity, proxies to sandbox-policy + ufw) ──────────────
[tasks.'policy:init']
description = "Init network policy preset: mise run policy:init [balanced|open|locked]"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-policy.ps1' init"

[tasks.'policy:ls']
description = "List policy rules: mise run policy:ls [--wide] [--sandbox NAME]"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-policy.ps1' ls"

[tasks.'policy:allow']
description = "Allow network host/cidr: mise run policy:allow network registry.npmjs.org [--sandbox NAME]"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-policy.ps1' allow"

[tasks.'policy:deny']
description = "Deny network host/cidr: mise run policy:deny network evil.com"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-policy.ps1' deny"

[tasks.'policy:rm']
description = "Remove policy rule: mise run policy:rm network --resource evil.com"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-policy.ps1' rm"

[tasks.'policy:check']
description = "Check if host would be allowed: mise run policy:check network api.github.com:443"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-policy.ps1' check"

[tasks.'policy:reset']
description = "Reset policy (clear custom rules, re-init balanced)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-policy.ps1' reset"

[tasks.'policy:preset']
description = "Manage presets: mise run policy:preset list|apply"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-policy.ps1' preset"

[tasks.'policy:dump']
description = "Dump Docker Sandbox preset if sbx present (or show balanced.txt)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/dump-docker-preset.ps1'"

# ── container ──────────────────────────────────────────────────────────────
[tasks.'container:build']
description = "Build the sandbox container image inside the running VM"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/container-build.ps1'"

[tasks.'container:info']
description = "Show container image info from inside the VM"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/container-info.ps1'"

# ── SBOM (Software Bill of Materials) ──────────────────────────────────────
[tasks.'sbom:container']
description = "Generate SBOM for the sandbox container image"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/sbom.ps1' container"

[tasks.'sbom:tools']
description = "Generate SBOM for installed mise toolchains"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/sbom.ps1' tools"

[tasks.'sbom:vm']
description = "Generate SBOM for VM apt packages"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/sbom.ps1' vm"

[tasks.'sbom:all']
description = "Generate all SBOMs (container + tools + VM)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/sbom.ps1' all"

# ── volume tools (inspect / manage mise installs) ──────────────────────────
[tasks.'tools:list']
description = "List all installed mise tools (shared + personal) with disk usage"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-tools.ps1' list"

[tasks.'tools:info']
description = "Show details for a specific tool: mise run tools:info TOOL=ripgrep"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-tools.ps1' info"

[tasks.'tools:clean']
description = "Remove a personal tool install: mise run tools:clean TOOL=ripgrep"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-tools.ps1' clean"

[tasks.'tools:clean:all']
description = "Remove all personal tool installs (prompts for confirmation)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-tools.ps1' clean:all"

[tasks.'tools:volumes']
description = "Show volume mount info and disk usage inside the VM"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-tools.ps1' volumes"

[tasks.'tools:search']
description = "Proxy-aware search over package managers + GitHub + Exa AI: mise run tools:search QUERY"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/manage-tools.ps1' search"

# ── observability (Grafana LGTM) ───────────────────────────────────────────
[tasks.'obs:start']
description = "Start LGTM container on host and deploy agents to VM"
run = """
set -e
pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/observability.ps1' start
if [ "$(echo $OBSERVABILITY_ENABLED)" = "true" ]; then
  pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/deploy-observability.ps1'
fi
"""

[tasks.'obs:stop']
description = "Stop LGTM container on host"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/observability.ps1' stop"

[tasks.'obs:status']
description = "Show LGTM observability status"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/observability.ps1' status"

[tasks.'obs:open']
description = "Open Grafana dashboard in browser"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/observability.ps1' open"

[tasks.'obs:deploy']
description = "Deploy observability agents to running VM (after obs:start)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/deploy-observability.ps1'"

[tasks.'obs:clean']
description = "Remove LGTM container and data volume"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/observability.ps1' clean"

# ── secrets ────────────────────────────────────────────────────────────────
[tasks.'secrets:init']
description = "Generate age keypair for secrets encryption"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/secrets.ps1' init"

[tasks.'secrets:encrypt']
description = "Encrypt config/secrets.env → config/secrets.env.enc (age)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/secrets.ps1' encrypt"

[tasks.'secrets:decrypt']
description = "Decrypt config/secrets.env.enc → config/secrets.env"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/secrets.ps1' decrypt"

[tasks.'secrets:sync']
description = "Sync encrypted secrets to VM and decrypt there"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/secrets.ps1' sync"

[tasks.'secrets:list']
description = "List configured secret key names on the VM"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/secrets.ps1' list"

[tasks.'secrets:status']
description = "Show secrets encryption and sync status"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/secrets.ps1' status"

# ── verification ───────────────────────────────────────────────────────────
[tasks.smoke]
description = "Quick smoke test (requires running VM)"
run = "pwsh -NoProfile -NoLogo -File '{{ config_root }}/vm/scripts/smoke-test.ps1'"

# ── convenience ────────────────────────────────────────────────────────────
[tasks.up]
description = "Full bring-up — deps check, download image, prepare, start, wait for SSH, optionally start observability"
run = """
set -e
mise run deps
mise run image:download
mise run vm:prepare
mise run vm:start
mise run vm:ssh:wait
if [ "$OBSERVABILITY_ENABLED" = "true" ]; then
  echo "--- Starting observability stack ---"
  mise run obs:start
fi
"""

[tasks.down]
description = "Stop VM, tear down bridge/TAP, stop observability"
run = """
set -e
mise run vm:stop
mise run network:down
if [ "$OBSERVABILITY_ENABLED" = "true" ]; then
  mise run obs:stop
fi
"""
