name: sandbox-proxy
description: MITM HTTP proxy for traffic observability
aliases: [gle-proxy]
flags:
  - name: --listen-port
    description: Proxy listen port (default: 8080)
    flag: --listen-port
    args:
      - name: port
        type: number
  - name: --log-dir
    description: JSONL log directory
    flag: --log-dir
    args:
      - name: dir
        type: path
  - name: --otel-endpoint
    description: OTel Collector OTLP/HTTP endpoint
    flag: --otel-endpoint
    args:
      - name: url
        type: string
