name: fenrir
description: Fenrir sandbox CLI — yolo-safe in-container (read-only; privileged ops via gleiphnir on host)
aliases: [fen]
commands:
  - name: tools
    description: inspect and manage mise tool installs (via gdu, yazi) + proxy-aware search — yolo-safe
    subcommands:
      - name: list
        description: List all installed tools (shared + personal) with disk usage
      - name: info
        description: Show details for a specific tool
        args:
          - name: tool
            description: Tool name to inspect
            dynamic: true
      - name: clean
        description: Remove a personal tool install (cannot remove shared tools)
        args:
          - name: tool
            description: Tool name to remove
            dynamic: true
      - name: clean:all
        description: Remove all personal tool installs (prompts for confirmation)
      - name: volumes
        description: Show volume mount info and disk usage (via gdu)
        flags:
          - name: --gdu
            description: Force gdu TUI
            flag: --gdu
          - name: --no-gdu
            description: Force fallback to du
            flag: --no-gdu
      - name: browse
        description: Browse tool volumes with yazi (yasi)
        args:
          - name: path
            description: Path to browse
            type: path
      - name: search
        description: Proxy-aware search over package managers + GitHub + Exa AI (exa.ai)
        args:
          - name: query
            description: Search query
        flags:
          - name: --source
            description: Source filter
            flag: --source
            args:
              - name: src
                enum: [npm, pypi, crates, go, github, exa, auto]
          - name: --json
            description: JSON output
            flag: --json

  - name: sbom
    description: generate Software Bill of Materials — yolo: container|tools only (vm/all denied inside, use gle sbom on host)
    subcommands:
      - name: container
        description: SBOM for the sandbox container image
        flags:
          - name: --format
            description: Output format
            flag: --format
            args:
              - name: format
                enum: [spdx-json, cyclonedx]
          - name: --output
            description: Output directory
            flag: --output
            args:
              - name: dir
                type: path
      - name: tools
        description: SBOM for installed mise toolchains
        flags:
          - name: --format
            description: Output format
            flag: --format
            args:
              - name: format
                enum: [spdx-json, cyclonedx]
          - name: --output
            description: Output directory
            flag: --output
            args:
              - name: dir
                type: path

  - name: journal
    description: query the agent audit journal (read-only)
    flags:
      - name: --last
        description: Show last N commands (default: 20)
        flag: --last
        args:
          - name: n
            type: number
      - name: --user
        description: Filter by user
        flag: --user
        args:
          - name: user
            type: string
      - name: --session
        description: Filter by session ID
        flag: --session
        args:
          - name: id
            type: string
      - name: --grep
        description: Search commands (regex)
        flag: --grep
        args:
          - name: pattern
            type: string
      - name: --since
        description: Filter by time duration
        flag: --since
        args:
          - name: duration
            enum: ["30s", "5m", "1h", "7d"]
      - name: --failed
        description: Only failed commands (exit_code != 0)
        flag: --failed
      - name: --cwd
        description: Filter by working directory prefix
        flag: --cwd
        args:
          - name: path
            type: path
      - name: --json
        description: Output raw JSON (one object per line)
        flag: --json
      - name: --follow
        description: Tail new entries (like tail -f)
        flag: --follow

  - name: policy
    description: Network policy (sbx parity) — yolo: read-only ls|check only (allow/deny/init via gle policy on host)
    subcommands:
      - name: ls
        description: List active policy rules (read-only)
        aliases: [list, show, status]
        flags:
          - name: --wide
            flag: --wide
          - name: --json
            flag: --json
          - name: --sandbox
            flag: --sandbox
            args:
              - name: name
                type: string
      - name: check
        description: Check if host would be allowed (read-only)
        args:
          - name: type
            enum: [network]
          - name: target
            description: Host, host:port, or URL
        flags:
          - name: --sandbox
            flag: --sandbox
            args:
              - name: name
                type: string

  - name: volumes
    description: Show volume mount info and disk usage (via gdu) — alias for tools volumes
    flags:
      - name: --gdu
        description: Force gdu TUI
        flag: --gdu
      - name: --no-gdu
        description: Force fallback
        flag: --no-gdu

  - name: browse
    description: Browse filesystem with yazi (yasi) — alias
    args:
      - name: path
        description: Path to browse
        type: path
