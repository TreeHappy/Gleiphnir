name: sandbox-secrets
description: manage sandbox secrets (admin only)
aliases: [gle-secrets]
commands:
  - name: list
    description: Show secret key names (not values)
  - name: set
    description: Add or update a secret
    args:
      - name: entry
        description: "KEY=VALUE or KEY (reads value from stdin)"
  - name: remove
    description: Delete a secret
    args:
      - name: key
        description: Secret key name to remove
        dynamic: true
  - name: export
    description: Dump all secrets as KEY=VALUE (admin only)
  - name: rotate
    description: Generate a random 32-char value for a key
    args:
      - name: key
        description: Secret key name to rotate
        dynamic: true
