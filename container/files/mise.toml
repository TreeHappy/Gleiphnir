# /etc/sandbox/mise.toml — default tool manifest for Gleiphnir sandboxes
# Installed lazily into the SHARED mise volume (sandbox-mise → /opt/mise-shared)
# on first container start / at build-container warm-up. Downloaded once for all
# sandbox users. Users can override/extend by placing their own mise.toml in /work.

[tools]
# CLI essentials
ripgrep = "latest"
fd = "latest"
fzf = "latest"
# gh is provided as `gh` via aqua:cli/cli internally
"aqua:cli/cli" = "latest"
delta = "latest"        # git-diff pager
hunk = "latest"         # review-first terminal diff viewer (modem-dev/hunk)
yazi = "latest"         # file manager TUI
leaf = "github:RivoLink/leaf"  # markdown reader (fallback: npm:@rivolink/leaf)
carapace = "latest"     # multi-shell completions
atuin = "latest"        # shell history
"github:equinix-labs/otel-cli" = "latest"   # OTel tracing for shell scripts

# Editors / shells / agents
neovim = "latest"
pwsh = "latest"         # default sandbox shell
opencode = "latest"     # AI coding agent

# Language runtimes
node = "lts"
python = "3.12"
golang = "latest"
dotnet = "latest"

[env]
EDITOR   = "nvim"
VISUAL   = "nvim"
PAGER    = "less"
MANPAGER = "nvim +Man!"
LANG     = "C.UTF-8"

[settings]
experimental = true
not_found_auto_install = true
jobs = 4

# ── dotfiles ────────────────────────────────────────────────────────────────
# Ships the sandbox shell configs into $HOME. Idempotent; re-run any time.
# Personal override: drop same-named files into /work/dotfiles/ — they win.
[tasks.dotfiles]
description = "Link sandbox dotfiles into $HOME (bashrc, pwsh profile, gitconfig, gitignore_global, inputrc, editorconfig)"
run = '''
set -e
SRC="/etc/sandbox/dotfiles"
mkdir -p "$HOME/.config/powershell"

link() {  # link <source> <target>
  local base target="$2"
  base="$(basename "$1")"
  if [ -f "/work/dotfiles/$base" ]; then
    ln -sfn "/work/dotfiles/$base" "$target"
  else
    ln -sfn "$1" "$target"
  fi
}

link "$SRC/bashrc"           "$HOME/.bashrc"
link "$SRC/profile.ps1"      "$HOME/.config/powershell/profile.ps1"
link "$SRC/gitconfig"        "$HOME/.gitconfig"
link "$SRC/gitignore_global" "$HOME/.gitignore_global"
link "$SRC/inputrc"          "$HOME/.inputrc"
link "$SRC/editorconfig"     "$HOME/.editorconfig"

# Configure git to use the global gitignore
if command -v git >/dev/null 2>&1; then
  git config --global core.excludesfile ~/.gitignore_global 2>/dev/null || true
fi

# Install Carapace completions (Gleiphnir custom specs + mise task specs)
if command -v carapace >/dev/null 2>&1; then
  mkdir -p "$HOME/.config/carapace/specs"
  for spec in /etc/carapace/specs/*.yaml; do
    [ -f "$spec" ] || continue
    ln -sfn "$spec" "$HOME/.config/carapace/specs/$(basename "$spec")"
  done
fi

echo "[sandbox] dotfiles linked."
'''

# ── dotfiles:init ─────────────────────────────────────────────────────────
# Scaffold /work/dotfiles/ with copies of all default dotfiles.
# Users edit these in-place; they take precedence over /etc/sandbox/dotfiles/.
[tasks.'dotfiles:init']
description = "Scaffold /work/dotfiles/ with editable copies of all default dotfiles"
run = '''
set -e
SRC="/etc/sandbox/dotfiles"
DST="/work/dotfiles"
mkdir -p "$DST"

for f in bashrc profile.ps1 gitconfig gitignore_global inputrc editorconfig; do
  if [ ! -f "$DST/$f" ]; then
    cp "$SRC/$f" "$DST/$f"
    echo "  created $DST/$f"
  else
    echo "  exists  $DST/$f (skipped)"
  fi
done

echo ""
echo "[sandbox] dotfiles scaffolded in $DST"
echo "  Edit files there — they override /etc/sandbox/dotfiles/ on next shell start."
echo "  Run 'mise run dotfiles' to re-link without restarting."
'''
